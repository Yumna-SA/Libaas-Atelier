<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor | Libaas Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-p="tailor">
<header id="h"></header>
<main class="wrap">
<h1>Assigned orders</h1>
<div class="two">
  <div class="card"><h3>Orders</h3><div id="tl"></div></div>
  <div id="td" hidden>
    <div class="card">
      <h3>Customer's final outfit</h3>
      <div class="pv" id="tp" style="display:block;text-align:center"></div>
    </div>
    <form class="card sec" id="mf" novalidate>
      <h3>Measurements (inches)</h3>
      <div class="g">
        <div><label>Chest</label><input name="chest" type="number" step="0.5"></div>
        <div><label>Waist</label><input name="waist" type="number" step="0.5"></div>
        <div><label>Hips</label><input name="hips" type="number" step="0.5"></div>
        <div><label>Shoulder</label><input name="shoulder" type="number" step="0.5"></div>
        <div><label>Sleeve length</label><input name="sleeve" type="number" step="0.5"></div>
        <div><label>Shirt length</label><input name="length" type="number" step="0.5"></div>
      </div>
      <label>Status</label>
      <select name="status"><option>Measured</option><option>Stitching</option><option>Ready</option></select>
      <label>Note for customer</label>
      <textarea name="notes" rows="2"></textarea>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn">Save</button>
    </form>
  </div>
</div>
</main>
<footer id="f"></footer>
<script src="js/app.js"></script>
</body>
</html>
