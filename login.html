<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | Libaas Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-p="login">
<header id="h"></header>
<main class="wrap">
<div class="card narrow">
  <h2 id="tt">Log in</h2>
  <form id="lf" novalidate>
    <div id="nm" hidden>
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn" id="sb">Log in</button>
    <a href="#" id="sw">New customer? Sign up</a>
  </form>
</div>ss
</main>
<footer id="f"></footer>
<script src="js/app.js"></script>
<script src="script.js" defer></script>
</body>
</html>
