<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style quiz | Libaas Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-p="quiz">
<header id="h"></header>
<main class="wrap">
<h1>Style quiz</h1>
<div class="two">
  <form class="card" id="qf" novalidate>
    <h3>Tell us about you</h3>
    <label>Body shape</label><div class="chips" id="qb"></div>
    <label>Skin tone</label><div class="chips" id="qs"></div>
    <label>Occasion</label><div class="chips" id="qo"></div>
    <label>Favorite color</label><div class="chips" id="qc"></div>
    <label>Budget</label><div class="chips" id="qd"></div>
    <p class="err" id="qe" role="alert"></p>
    <button class="btn">Get my suggestion</button>
  </form>
  <div class="card" id="res">
    <h3>Your suggestion</h3>
    <p class="empty">Answer the questions and your outfit appears here.</p>
  </div>
</div>
</main>
<footer id="f"></footer>
<script src="js/app.js"></script>
</body>
</html>
